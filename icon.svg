<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b4a8a"/><stop offset=".55" stop-color="#14325c"/><stop offset="1" stop-color="#0e7c86"/>
    </linearGradient>
    <linearGradient id="tb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a246a"/><stop offset="1" stop-color="#5f8fd6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd35c"/><stop offset="1" stop-color="#f2a900"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <!-- خلفية كاملة (تصلح للأيقونة المقنّعة) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="430" cy="70" r="150" fill="#fff" opacity=".06"/>
  <circle cx="60" cy="470" r="120" fill="#f2a900" opacity=".10"/>
  <!-- نافذة VB6 -->
  <g filter="url(#sh)">
    <rect x="96" y="112" width="320" height="250" rx="14" fill="#d4d0c8"/>
    <path d="M96 126 a14 14 0 0 1 14 -14 h292 a14 14 0 0 1 14 14 v32 h-320 z" fill="url(#tb)"/>
    <rect x="336" y="124" width="20" height="20" rx="3" fill="#d4d0c8"/>
    <rect x="362" y="124" width="20" height="20" rx="3" fill="#d4d0c8"/>
    <rect x="388" y="124" width="20" height="20" rx="3" fill="#e05a4f"/>
    <circle cx="118" cy="135" r="7" fill="#ffd35c"/>
    <!-- أدوات داخل النموذج -->
    <rect x="122" y="182" width="120" height="30" rx="4" fill="#fff" stroke="#808080" stroke-width="3"/>
    <rect x="122" y="226" width="120" height="30" rx="4" fill="#fff" stroke="#808080" stroke-width="3"/>
    <rect x="122" y="276" width="120" height="44" rx="6" fill="#e9e6df" stroke="#5a5a5a" stroke-width="3"/>
    <rect x="146" y="294" width="72" height="8" rx="4" fill="#5a5a5a"/>
    <rect x="132" y="193" width="60" height="8" rx="4" fill="#9aa"/>
    <rect x="132" y="237" width="40" height="8" rx="4" fill="#9aa"/>
  </g>
  <!-- شعار VB -->
  <g filter="url(#sh)">
    <rect x="262" y="176" width="134" height="150" rx="22" fill="url(#gold)"/>
    <text x="329" y="276" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="78" fill="#14325c">VB</text>
  </g>
  <!-- أقواس الشيفرة -->
  <text x="256" y="440" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-weight="700" font-size="62" fill="#ffd35c">&lt;/&gt;</text>
</svg>
