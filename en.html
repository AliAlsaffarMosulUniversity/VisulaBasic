<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#17233b;--mut:#5b6b85;--bg:#f4f1ea;--card:#fff;--line:#e4dfd3;--brand:#14325c;--accent:#f2a900;--teal:#0e7c86;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo','Segoe UI',Tahoma,sans-serif;font-size:16px;line-height:1.85;direction:rtl}
a{color:inherit;text-decoration:none}
#app{max-width:880px;margin:0 auto;min-height:100vh;padding-bottom:84px}
header.top{position:sticky;top:0;z-index:20;height:66px;background:var(--brand);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 16px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
header.top .logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:15px;font-family:monospace}
header.top b{font-size:16px;line-height:1.2}header.top small{display:block;opacity:.75;font-size:12px;font-weight:400}
#view{padding:16px}
.en{direction:ltr;unicode-bidi:isolate;display:inline-block;font-family:'Consolas','Courier New',monospace;font-size:.86em;background:#eef2f8;border:1px solid #dbe3f0;border-radius:6px;padding:0 6px;line-height:1.55;color:#12305b;white-space:nowrap}
h1{font-size:26px;line-height:1.35;margin:.2em 0}h2.sec{font-size:19px;margin:28px 0 10px;color:var(--brand)}
h3{font-size:19px;margin:30px 0 8px;color:var(--brand);padding-right:12px;border-right:5px solid var(--accent);line-height:1.5}
p{margin:.5em 0}ul,ol{padding-right:24px;margin:.5em 0}li{margin:.25em 0}
.muted{color:var(--mut)}
.btn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-weight:700;border:0;background:var(--brand);color:#fff;padding:10px 18px;border-radius:12px;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(1px)}.btn.ghost{background:var(--card);color:var(--brand);border:2px solid var(--brand);box-shadow:none}.btn.small{padding:6px 14px;font-size:14px;margin-top:8px}.btn.danger{color:#b3261e;border-color:#b3261e;margin-top:24px}
.hero{display:flex;gap:18px;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#14325c,#1d4f86 60%,#0e7c86);color:#fff;border-radius:22px;padding:22px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;left:-50px;top:-50px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.05)}
.kicker{color:var(--accent);font-weight:700;font-size:14px}.hero h1{font-size:28px;margin:.1em 0 .3em}.hero p{opacity:.92;font-size:15px}
.hero .en{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3);color:#fff}
.herobtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.hero .btn{background:var(--accent);color:var(--brand)}.hero .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.7)}
.ring{--p:0;flex:none;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),rgba(255,255,255,.22) 0);display:grid;place-items:center;position:relative;z-index:1}
.ring:before{content:'';position:absolute;inset:9px;border-radius:50%;background:#173a66}.ring b,.ring small{position:relative;text-align:center;line-height:1.1}.ring b{font-size:22px;margin-top:20px}.ring small{font-size:11px;margin-top:-34px;opacity:.8}
.ring.big{width:120px;height:120px;margin:0 auto;background:conic-gradient(var(--teal) calc(var(--p)*1%),#dfe6ee 0)}.ring.big:before{background:#fff}.ring.big b{margin-top:0;color:var(--brand);font-size:26px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.chcard{--c:#0e7c86;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;position:relative;display:block;box-shadow:0 1px 0 rgba(0,0,0,.04);border-top:5px solid var(--c)}
.chcard:active{transform:scale(.99)}.chico{font-size:30px;line-height:1}.chnum{color:var(--c);font-size:13px;font-weight:700;margin-top:6px}.chcard b{display:block;font-size:17px;line-height:1.4}.chcard small{display:block;color:var(--mut);font-size:13px;line-height:1.5;margin:2px 0 10px}
.bar{height:8px;background:#e8e4d9;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--c,var(--teal));border-radius:99px;transition:width .3s}.chmeta{font-size:12px;color:var(--mut);margin-top:6px}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.quick a{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;font-weight:700;text-align:center}.quick span{display:block;font-size:26px}.quick small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.foot{margin:34px 0 8px;text-align:center;line-height:1.9;color:var(--mut);font-size:14px;font-weight:700}.foot small{display:block;margin-top:8px;font-weight:400;font-size:12px;opacity:.8}
nav#nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;max-width:880px;margin:0 auto;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 14px rgba(0,0,0,.06)}
nav#nav a{flex:1;text-align:center;font-size:12px;font-weight:700;color:var(--mut);padding:4px 0;border-radius:12px;line-height:1.3}nav#nav a span{display:block;font-size:20px}nav#nav a.on{color:var(--brand);background:#eef2f8}
.chhead{--c:#0e7c86;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-right:6px solid var(--c);border-radius:var(--r);padding:12px 14px;position:relative}
.chhead .chico{font-size:34px}.chhead h1{font-size:22px;margin:0}.chhead .back{position:absolute;left:12px;top:10px;font-size:13px;color:var(--mut)}
.tabs2{display:flex;gap:6px;margin:14px 0;position:sticky;top:66px;z-index:10;background:var(--bg);padding:6px 0}.tabs2 button{flex:1;font:inherit;font-weight:700;border:2px solid var(--line);background:var(--card);color:var(--mut);padding:8px;border-radius:12px;cursor:pointer}.tabs2 button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.chbody{padding:0 2px}
.callout{display:flex;gap:10px;border-radius:14px;padding:12px 14px;margin:14px 0;font-size:15.5px}.callout>span{font-size:20px;line-height:1.5}.callout.tip{background:#e9f6ef;border:1px solid #b9e2cb}.callout.warn{background:#fff4de;border:1px solid #f1d28b}.callout.note{background:#eaf1fb;border:1px solid #c5d8f2}
.tblwrap{overflow-x:auto;margin:12px 0;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.tbl{border-collapse:collapse;width:100%;font-size:15px}.tbl th{background:#14325c;color:#fff;text-align:right;padding:8px 12px;font-weight:700;white-space:nowrap}.tbl td{padding:8px 12px;border-top:1px solid var(--line);vertical-align:top}.tbl tr:nth-child(even) td{background:#faf8f3}.tl{font-family:monospace;font-size:13px;text-align:left}
.codewrap{margin:12px 0}.codecap{font-size:13px;color:var(--mut)}
pre.code{margin:10px 0;background:#0f1d33;color:#e6edf7;border-radius:12px;padding:14px 16px;font-family:'Consolas','Courier New',monospace;font-size:13.5px;line-height:1.75;overflow-x:auto;text-align:left;direction:ltr;white-space:pre;tab-size:3}
pre.code i{font-style:normal}.code .k{color:#7cc4ff;font-weight:700}.code .s{color:#f9b872}.code .c{color:#8fb78f}.code .n{color:#d7a6ff}.code .t{color:#7fe3b0}
.excard{background:var(--card);border:2px solid #d8e3f3;border-radius:18px;padding:14px;margin:18px 0;box-shadow:0 4px 0 #e6edf8}
.exhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.exhead b{font-size:17px}.exbadge{background:var(--accent);color:var(--brand);font-weight:800;border-radius:8px;padding:0 10px;font-size:13px}
.exdesc{color:var(--mut);font-size:15px;margin:.3em 0 10px}
.runner{background:repeating-linear-gradient(45deg,#e9e5da,#e9e5da 8px,#eeeadf 8px,#eeeadf 16px);border-radius:14px;padding:12px 4px;overflow:hidden;min-height:60px}
.exbtns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}.exbtns button{font:inherit;font-weight:700;font-size:14px;border:2px solid #cfd9ea;background:#f5f8fd;color:var(--brand);padding:6px 12px;border-radius:10px;cursor:pointer}.exbtns .btn{color:#fff;background:var(--brand);border:0;padding:10px 18px;font-size:16px}.exbtns .btn.ghost{background:var(--card);color:var(--brand);border:2px solid var(--brand)}
.subh{font-weight:800;color:var(--brand);margin:14px 0 4px;font-size:15px}
.pager{display:flex;justify-content:space-between;margin:34px 0 10px}
/* VB window */
.vbhold{margin:0 auto;position:relative;direction:ltr}
.vbwin{direction:ltr;text-align:left;display:inline-block;transform-origin:top left;background:#d4d0c8;border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:1px 1px 0 #808080,4px 5px 10px rgba(0,0,0,.35);font-family:Tahoma,'Segoe UI',Arial,sans-serif;font-size:11px;color:#000;position:relative;padding:2px}
.vbwin.small{display:block;transform:none;margin:8px auto;max-width:360px}
.vbtitle{background:linear-gradient(90deg,#0a246a,#a6caf0);color:#fff;font-weight:700;font-size:12px;padding:3px 4px;display:flex;justify-content:space-between;align-items:center;height:22px}
.vbwb i{font-style:normal;display:inline-block;width:16px;height:14px;background:#d4d0c8;color:#000;border:1px solid;border-color:#fff #404040 #404040 #fff;font-size:9px;line-height:12px;text-align:center;margin-left:2px}
.vbbody{position:relative;overflow:hidden;background:#d4d0c8;margin-top:2px;border:1px solid #808080;user-select:none;-webkit-user-select:none}
.vbprint{position:absolute;left:6px;top:4px;right:6px;font-family:'Consolas','Courier New',monospace;font-size:12px;white-space:pre;pointer-events:none;color:#000;z-index:0}
.vbc{position:absolute;z-index:1;margin:0;font-family:Tahoma,'Segoe UI',Arial,sans-serif;font-size:11px;overflow:hidden}
.vblabel{white-space:pre-wrap;line-height:1.3;padding:1px 2px}
.vblabel.bd1,.vbimg.bd1{border:1px solid;border-color:#808080 #fff #fff #808080}
.vbtext{border:2px solid;border-color:#808080 #fff #fff #808080;outline:0;padding:1px 3px;background:#fff;color:#000;border-radius:0;box-shadow:inset 1px 1px 0 #404040;user-select:text;-webkit-user-select:text;font-size:11px}
textarea.vbtext{resize:none}
.vbtext:focus{box-shadow:inset 1px 1px 0 #404040,0 0 0 1px #0a246a}.vbtext:disabled{color:#808080}
.vbbtn{text-align:center!important;background:#d4d0c8;border:2px solid;border-color:#fff #404040 #404040 #fff;padding:0 4px;cursor:default;color:#000;outline:0;box-shadow:1px 1px 0 #808080;border-radius:0}
.vbbtn:active{border-color:#404040 #fff #fff #404040;padding:2px 2px 0 6px}.vbbtn:focus-visible{outline:1px dotted #000;outline-offset:-5px}.vbbtn.isdef{border:2px solid #000;box-shadow:none}.vbbtn:disabled{color:#808080;text-shadow:1px 1px 0 #fff}
.vbimg{display:grid;place-items:center;line-height:1;cursor:grab}
.vbghost{position:fixed!important;z-index:9999;opacity:.65;pointer-events:none;display:grid;place-items:center;background:transparent!important}
.vbov{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.28);display:grid;place-items:center}
.vbdlg{background:#d4d0c8;border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:2px 3px 10px rgba(0,0,0,.5);min-width:180px;max-width:92%;font-size:12px;padding:2px}
.dtitle{background:linear-gradient(90deg,#0a246a,#a6caf0);color:#fff;font-weight:700;padding:2px 4px;display:flex;justify-content:space-between;align-items:center}.dtitle i{font-style:normal;background:#d4d0c8;color:#000;width:16px;text-align:center;cursor:pointer;border:1px solid;border-color:#fff #404040 #404040 #fff;font-size:10px}
.dbody{display:flex;gap:12px;padding:14px 14px 10px;align-items:flex-start}.dico{font-size:30px;line-height:1}.dmsg{flex:1;font-size:12px;line-height:1.5;word-break:break-word}.dar{margin-top:8px;font-family:'Cairo',sans-serif;font-size:12.5px;color:#7a1f1f;line-height:1.6}
.dinput{padding:0 14px 6px}.dinput input{width:100%;border:2px solid;border-color:#808080 #fff #fff #808080;padding:3px 5px;font:inherit;background:#fff;outline:0}
.dbtns{display:flex;gap:8px;justify-content:center;padding:6px 10px 12px;flex-wrap:wrap}.dbtns button{min-width:68px;padding:3px 10px;font:inherit;background:#d4d0c8;border:2px solid;border-color:#fff #404040 #404040 #fff;cursor:pointer;color:#000}.dbtns button.def{border:2px solid #000}.dbtns button:active{border-color:#404040 #fff #fff #404040}
.vbend{position:absolute;inset:0;z-index:60;background:rgba(30,30,40,.55);display:grid;place-items:center;color:#fff}.vbend div{text-align:center;display:grid;gap:6px;font-family:'Cairo',sans-serif}.vbend b{font-size:22px;font-family:monospace}.vbend button{font:inherit;font-weight:700;background:var(--accent);border:0;border-radius:8px;padding:6px 14px;cursor:pointer;color:#14325c}
.cerr{background:#2a0f0f;color:#ffb4b4;border-radius:12px;padding:14px;font-family:monospace;font-size:13.5px;line-height:1.6;margin:6px}
/* widgets */
.widget{background:var(--card);border:2px dashed #c9d6ea;border-radius:16px;padding:12px;margin:14px 0}
.winfo{background:#f3f7fd;border-radius:12px;padding:10px 12px;margin-top:10px;font-size:15px;min-height:44px}.winfo p{margin:.2em 0}
.ide{display:grid;gap:6px;font-family:Tahoma,Arial,sans-serif;font-size:12px}.ide .r{font:inherit;background:#d4d0c8;border:2px solid;border-color:#fff #404040 #404040 #fff;padding:8px 4px;cursor:pointer;color:#000;font-weight:700}.ide .r.on{background:#ffe9a8;outline:2px solid var(--accent)}
.ide-main{display:grid;grid-template-columns:70px 1fr 120px;gap:6px;min-height:150px}.ide-right{display:grid;grid-template-rows:1fr 1.3fr .8fr;gap:6px}.ide .r-form{background:repeating-conic-gradient(#fff 0 25%,#f1f1f1 0 50%) 0 0/10px 10px}.ide .r-form span{background:#0a246a;color:#fff;display:block;padding:2px 6px;text-align:left}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}.tools button{font-family:Tahoma,Arial,sans-serif;background:#d4d0c8;border:2px solid;border-color:#fff #404040 #404040 #fff;padding:6px 2px;cursor:pointer;color:#000}.tools span{display:block;font-size:20px;line-height:1.2}.tools small{font-size:10.5px}.tools button.on{background:#ffe9a8}
.wl{display:block;font-weight:700;margin:12px 0 4px;color:var(--brand);font-size:15px}.winput,.sel{width:100%;font:inherit;padding:9px 12px;border:2px solid #cfd9ea;border-radius:12px;background:var(--card);color:var(--ink)}.winput[dir=ltr]{font-family:monospace}
.rule{display:flex;gap:8px;padding:3px 0;font-size:15px}.rule span{font-weight:800;width:20px}.rule.ok span{color:#1b8a4b}.rule.no span{color:#c62828}.verdict{margin-top:8px;border-radius:10px;padding:8px 12px;font-weight:800;text-align:center}.verdict.ok{background:#e3f6ea;color:#17703e}.verdict.no{background:#fde7e7;color:#a4262c}
.mrow{display:flex;gap:10px;flex-wrap:wrap}.mrow label{flex:1;min-width:100px;font-weight:700;font-size:14px;color:var(--brand)}.mrow input,.mrow select{display:block;width:100%;margin-top:3px;font:inherit;font-family:monospace;padding:7px 9px;border:2px solid #cfd9ea;border-radius:10px;background:var(--card)}
.mcode{margin:10px 0}.mcode{background:#0f1d33;color:#e6edf7;border-radius:10px;padding:10px 14px;font-family:monospace;font-size:13.5px;white-space:pre;direction:ltr;text-align:left}.mcode i{font-style:normal}.mcode .k{color:#7cc4ff;font-weight:700}.mcode .s{color:#f9b872}.mcode .c{color:#8fb78f}.mcode .n{color:#d7a6ff}.mcode .t{color:#7fe3b0}
.memcell{display:inline-block;border:3px solid var(--teal);border-radius:12px;padding:6px 18px;text-align:center;background:#e9f7f8}.memcell small{display:block;color:var(--mut)}.memcell b{font-size:24px;font-family:monospace;color:var(--brand)}.memerr{background:#fde7e7;color:#a4262c;border-radius:10px;padding:10px 12px;font-weight:700}
.mbstage{margin-top:8px}.mbres{margin-top:6px;font-weight:700}
.mouse{display:grid;gap:8px}.marea{height:130px;border-radius:12px;background:repeating-linear-gradient(0deg,#eef3fb,#eef3fb 14px,#e2eaf7 14px,#e2eaf7 15px);border:2px solid #b7c8e4;display:grid;place-items:center;color:var(--mut);font-family:monospace;user-select:none;-webkit-user-select:none}.mout{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.mout div{background:#0f1d33;color:#9fe0b1;border-radius:10px;padding:6px 8px;text-align:center;font-family:monospace}.mout span{display:block;font-size:11px;color:#9ab}.mout b{font-size:15px}
/* quiz */
.qintro{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:12px;display:flex;flex-direction:column}.qintro span{color:var(--mut);font-size:14px}.qintro.big{align-items:center;text-align:center;gap:10px;padding:22px}.qintro.big b{font-size:22px}.scale{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.scale span{background:#eef2f8;border-radius:8px;padding:2px 10px;font-size:13px}
.qprog{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--mut);margin-bottom:8px}.qprog .bar{flex:1}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}.qtext{font-size:18px;font-weight:700;line-height:1.7}
.opts{display:grid;gap:8px;margin-top:12px}.opt{font:inherit;text-align:right;background:#f6f8fc;border:2px solid #d3ddee;border-radius:12px;padding:10px 14px;cursor:pointer;color:var(--ink);line-height:1.6}.opt:active{transform:scale(.99)}.opt:disabled{cursor:default;color:var(--ink)}.opt.right{background:#e3f6ea;border-color:#2e9e5b}.opt.wrong{background:#fde7e7;border-color:#d34a4a}
.qfb{margin-top:12px;border-radius:12px;padding:10px 14px;font-size:15px}.qfb.good{background:#e9f8ee}.qfb.bad{background:#fff0e0}.qcard .btn{margin-top:12px}
.result{text-align:center}.rev{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:10px 0;text-align:right}.rev .ans{color:#17703e;font-weight:700;margin-top:4px}.rev small{color:var(--mut)}
.task{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}.tnum{flex:none;width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--brand);display:grid;place-items:center;font-weight:800}.tbody{flex:1;min-width:0}details summary{cursor:pointer;font-weight:700;color:var(--teal);margin-top:6px}
/* lab */
.pagehead p{color:var(--mut)}.editor{width:100%;min-height:300px;margin-top:10px;background:#0f1d33;color:#e6edf7;border:0;border-radius:14px;padding:14px;font-family:'Consolas','Courier New',monospace;font-size:13.5px;line-height:1.7;resize:vertical;direction:ltr;text-align:left;tab-size:3;outline:0}
.editor:focus{box-shadow:0 0 0 3px rgba(242,169,0,.5)}.snips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.snips button{font:inherit;font-family:monospace;font-size:13px;background:var(--card);border:1px solid #cfd9ea;border-radius:8px;padding:2px 10px;cursor:pointer;color:var(--brand)}
.cheat{margin-top:14px}.runner.lab{margin-top:10px}
.gl{display:grid;gap:8px;margin-top:12px}.gi{display:flex;gap:12px;align-items:baseline;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}.gi .en{flex:none;min-width:110px;text-align:center}.gi span{font-size:15px}
.cards2{display:grid;gap:10px}.prow{--c:#0e7c86;display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:8px 0;border-right:5px solid var(--c)}.pico{font-size:26px}.pmid{flex:1}.pmid small{color:var(--mut)}.ppct{font-weight:800;color:var(--brand);font-size:18px}
textarea.note{width:100%;min-height:76px;font:inherit;border:2px solid #cfd9ea;border-radius:12px;padding:8px 12px;background:var(--card)}
@media (min-width:700px){#view{padding:22px}.hero h1{font-size:34px}}
@media (max-width:380px){.ide-main{grid-template-columns:56px 1fr 96px}.hero{flex-direction:column-reverse;align-items:flex-start}.mout{grid-template-columns:repeat(3,1fr)}}
.guide{background:#fffaf0;border:2px solid #f1d28b;border-radius:14px;padding:10px 14px;margin:10px 0}
.guide summary{cursor:pointer;font-weight:800;color:var(--brand);margin:0 0 4px}
.guide p{margin:.3em 0;font-size:15.5px}
.gsub{font-weight:800;color:#8a5a00;margin:12px 0 4px;font-size:14.5px}
.grow{display:flex;flex-direction:column;gap:2px;padding:6px 0;border-top:1px dashed #ecd9a8}
.gname{line-height:1.4}.gtext{font-size:15px}
.appgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0}
.appcard{position:relative;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 3px 0 #e6e0d2}
.appcard span{font-size:34px;line-height:1.2}.appcard b{font-size:14px;line-height:1.45}.appcard i{position:absolute;top:6px;left:8px;font-style:normal;color:#1b8a4b;font-weight:800}
.appcard.on{border-color:var(--accent);background:#fff8e1}
.gsteps{margin:.3em 0;padding-right:22px}.gsteps li{font-size:15px;margin:.3em 0}
nav#nav a{font-size:11px}
header.top img.logo{width:44px;height:44px;border-radius:50%;background:#fff;padding:2px;object-fit:contain}
.college{display:flex;align-items:center;justify-content:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:14px;text-align:center}
.college img{width:84px;height:84px;flex:none}
.college div{display:flex;flex-direction:column;line-height:1.6}
.college b{font-size:19px;color:var(--brand)}
.college span{font-size:15.5px;font-weight:700;color:#7b2fa8}
.college span+span{color:var(--mut);font-weight:600}
header.top{height:auto;min-height:66px;padding:8px 14px}
header.top img.logo{width:52px;height:52px}
.htxt{display:flex;flex-direction:column;line-height:1.35}
.htxt small{display:block;opacity:.85;font-size:12px;font-weight:600}
.htxt b{font-size:16px;margin-top:2px;color:#ffd35c}
.college strong{font-size:20px;color:var(--brand);margin-top:4px;padding-top:6px;border-top:2px solid var(--accent)}
.tabs2{top:70px}
body.home header.top{display:none}
.hcol{display:flex;align-items:center;gap:14px;margin-bottom:6px}

.hcol span{font-size:14.5px;font-weight:700;opacity:.92}

.hero{position:relative}.herotxt{position:relative;z-index:1}

html[data-theme=dark] .btn{background:#2f5fb3;color:#fff}

html[data-theme=dark] .callout.tip{background:#14301f;border-color:#2c6b45}
html[data-theme=dark] .callout.warn{background:#3a2c0e;border-color:#7a5c1a}

html[data-theme=dark] .grow{border-color:#4a3f22}

/* زر الشمس والقمر */
.themebtn{position:fixed;top:12px;left:12px;z-index:60;width:66px;height:34px;border-radius:99px;border:0;padding:0;cursor:pointer;
  background:linear-gradient(135deg,#7cc6ff,#c8ecff);box-shadow:0 3px 10px rgba(0,0,0,.25),inset 0 0 0 2px rgba(255,255,255,.6);transition:background .4s}
.themebtn .knob{position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:17px;line-height:1;
  background:#ffd34d;box-shadow:0 0 12px rgba(255,200,40,.9);transition:left .4s cubic-bezier(.5,1.6,.4,1),background .4s,box-shadow .4s}
.themebtn .knob:before{content:"☀️"}
.themebtn .st{position:absolute;right:9px;top:8px;font-size:12px;opacity:0;transition:opacity .4s}
.themebtn .cl{position:absolute;right:9px;top:9px;font-size:13px;opacity:1;transition:opacity .4s}
html[data-theme=dark] .themebtn{background:linear-gradient(135deg,#0b1330,#283a6e);box-shadow:0 3px 10px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.15)}
html[data-theme=dark] .themebtn .knob{left:35px;background:#e8ecf8;box-shadow:0 0 12px rgba(200,215,255,.8)}
html[data-theme=dark] .themebtn .knob:before{content:"🌙"}
html[data-theme=dark] .themebtn .st{opacity:1;right:auto;left:10px}
html[data-theme=dark] .themebtn .cl{opacity:0}
.themebtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
body:not(.home) .themebtn{top:18px}
.install{display:flex;align-items:center;gap:12px;background:var(--card);border:2px dashed var(--teal);border-radius:16px;padding:12px 14px;margin:16px 0 0}
.install>span{font-size:30px}.install div{flex:1;display:flex;flex-direction:column;line-height:1.5}.install small{color:var(--mut)}
.instov{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:16px}
.instbox{background:var(--card);color:var(--ink);border-radius:18px;padding:18px 20px;max-width:420px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.instbox b{font-size:18px}.instbox ol{padding-right:22px}.instbox li{margin:.4em 0}.instbox .btn{width:100%;justify-content:center;margin-top:6px}
.instbox .en{white-space:normal;word-break:break-all}.instbox{overflow:hidden}
.invite{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin:14px 0 0}
.invite img{width:118px;height:118px;flex:none;border-radius:12px;background:#fff;padding:4px;border:1px solid var(--line)}
.invtxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.invtxt b{font-size:17px;color:var(--brand)}.invtxt small{color:var(--mut);font-size:13px}
.invtxt .en{white-space:normal;word-break:break-all;font-size:11px;align-self:flex-start}
.invbtns{display:flex;flex-wrap:wrap;gap:6px}.invbtns .btn{margin-top:4px;padding:5px 12px;font-size:13px}
/* شارة «جديد» اللامعة */
.newbadge{position:relative;display:inline-block;overflow:hidden;vertical-align:middle;font-size:11.5px;font-weight:800;line-height:1.5;padding:1px 9px;border-radius:99px;color:#fff;
  background:linear-gradient(135deg,#ff3d6e,#ff8a00 55%,#ffd000);box-shadow:0 0 0 1px rgba(255,255,255,.5) inset,0 0 10px rgba(255,90,60,.65);animation:newpulse 1.6s ease-in-out infinite;text-shadow:0 1px 1px rgba(120,20,0,.45)}
.newbadge:after{content:"";position:absolute;top:-50%;left:-60%;width:40%;height:200%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);transform:rotate(25deg);animation:newshine 2.2s ease-in-out infinite}
@keyframes newshine{0%{left:-60%}55%,100%{left:130%}}
@keyframes newpulse{0%,100%{box-shadow:0 0 0 1px rgba(255,255,255,.5) inset,0 0 6px rgba(255,90,60,.5);transform:scale(1)}50%{box-shadow:0 0 0 1px rgba(255,255,255,.6) inset,0 0 16px rgba(255,140,0,.95);transform:scale(1.07)}}
.tabs2 button .newbadge{font-size:10px;padding:0 7px;margin-right:2px}
.tabs2 button{display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;font-size:14px;padding:7px 4px;line-height:1.4}
.chnew{margin-top:8px;font-size:12.5px;font-weight:700;color:var(--ink)}
.pracintro b{display:flex;align-items:center;gap:8px;font-size:17px}
.pracn{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}.pracn span{font-size:14px;color:var(--mut)}.pracn .btn{margin-top:0}
@media (prefers-reduced-motion:reduce){.newbadge,.newbadge:after{animation:none}}
h2.h3{font-size:19px;margin:30px 0 8px;color:var(--brand);padding-right:12px;border-right:5px solid var(--accent);line-height:1.5}
html[data-theme=dark] h2.h3{color:#cfe0ff}
details summary{color:#0a5c63}
html[data-theme=dark] details summary{color:#7fd6dd}

  String.raw`
Option Explicit
Dim q As Integer
Dim answer As Integer
Dim score As Integer

Private Sub ShowQ()
Label1.Caption = "Question " & q & " of 5     Score: " & score
Select Case q
Case 1
Label2.Caption = "Which property shows the text of a Label?"
Command1.Caption = "Text"
Command2.Caption = "Caption"
Command3.Caption = "Name"
answer = 2
Case 2
Label2.Caption = "Which function changes text to a number?"
Command1.Caption = "Val"
Command2.Caption = "Len"
Command3.Caption = "Str"
answer = 1
Case 3
Label2.Caption = "Which statement declares a variable?"
Command1.Caption = "Const"
Command2.Caption = "Print"
Command3.Caption = "Dim"
answer = 3
Case 4
Label2.Caption = "MsgBox returns 6 when the user presses:"
Command1.Caption = "Yes"
Command2.Caption = "No"
Command3.Caption = "Cancel"
answer = 1
Case 5
Label2.Caption = "Which event runs when the form opens?"
Command1.Caption = "Click"
Command2.Caption = "Form_Load"
Command3.Caption = "Change"
answer = 2
Case Else
Label1.Caption = "Finished"
Label2.Caption = "Your score: " & score & " / 5"
Command1.Visible = False
Command2.Visible = False
Command3.Visible = False
Command4.Visible = True
If score >= 3 Then
Label3.Caption = "Passed 🎉"
Else
Label3.Caption = "Try again"
End If
End Select
End Sub

Private Sub Check(c As Integer)
If c = answer Then
score = score + 1
Label3.Caption = "Correct ✔"
Label3.ForeColor = RGB(0, 140, 0)
Else
Label3.Caption = "Wrong ✘"
Label3.ForeColor = vbRed
End If
q = q + 1
ShowQ
End Sub

Private Sub Form_Load()
q = 1
score = 0
Label3.Caption = ""
ShowQ
End Sub

Private Sub Command1_Click()
Check 1
End Sub

Private Sub Command2_Click()
Check 2
End Sub

Private Sub Command3_Click()
Check 3
End Sub

Private Sub Command4_Click()
Command1.Visible = True
Command2.Visible = True
Command3.Visible = True
Command4.Visible = False
Label3.ForeColor = vbBlack
Form_Load
End Sub`);

}

    "<div class=\"subh\">A complete example for each statement (loads into the editor):</div><div class=\"snips ex2\">" + [['cmd_dim', 'Dim'], ['cmd_msgbox', 'MsgBox'], ['cmd_inputbox', 'InputBox'], ['cmd_select', 'Select Case'], ['cmd_if', 'If'], ['cmd_click', 'Click']].map(x => '<button data-ex2="' + x[0] + '"' + (e.id === x[0] ? ' class="on"' : '') + '>▶ ' + x[1] + '</button>').join('') + '</div>' +

  const ta = $('#labcode'); ta.value = labState.code != null ? labState.code : e.code;

  $('#labgo').onclick = run;

  ta.addEventListener('keydown', ev => {
    if (ev.key === 'Tab') { ev.preventDefault(); const s = ta.selectionStart; ta.value = ta.value.slice(0, s) + '   ' + ta.value.slice(ta.selectionEnd); ta.selectionStart = ta.selectionEnd = s + 3; }
    if ((ev.ctrlKey || ev.metaKey) && ev.key === 'Enter') { ev.preventDefault(); run(); }
  });
  let lastSnip = null; // آخر قطعة أُدرجت: {start, text}
  const snipHandler = ev => {
    const e2 = ev.target.closest('[data-ex2]'); if (e2) { labState = { id: e2.dataset.ex2, code: null }; viewLab(); return; }
    const clr = ev.target.closest('[data-clear]');

    const b = ev.target.closest('[data-s]'); if (!b) return;
    const t = SNIP[b.dataset.s][1]; let v = ta.value;
    // إن كانت القطعة السابقة ما زالت كما أُدرجت دون تعديل، نستبدلها بالجديدة
    if (lastSnip && v.slice(lastSnip.start, lastSnip.start + lastSnip.text.length) === lastSnip.text) {
      ta.value = v.slice(0, lastSnip.start) + t + v.slice(lastSnip.start + lastSnip.text.length);
      lastSnip = { start: lastSnip.start, text: t };
      ta.focus(); ta.selectionStart = ta.selectionEnd = lastSnip.start + t.length; return;
    }
    // وإلا نُدرجها في سطر جديد بعد السطر الحالي، حتى لا تدخل داخل نص بين علامتي اقتباس
    let s = ta.selectionStart;
    let ls = v.lastIndexOf('\n', s - 1) + 1, le = v.indexOf('\n', s); if (le < 0) le = v.length;
    const line = v.slice(ls, le).trim();
    let pos = line === '' ? ls : le + 1, pre = '';
    if (line !== '' && le === v.length) { pre = '\n'; pos = v.length; }
    ta.value = v.slice(0, pos) + pre + t + v.slice(pos);
    lastSnip = { start: pos + pre.length, text: t };
    ta.focus(); ta.selectionStart = ta.selectionEnd = pos + pre.length + t.length;
  };
  $$('.snips').forEach(el => { el.onclick = snipHandler; });
  ta.addEventListener('input', () => { lastSnip = null; });
}

    : ["Open the link in Chrome or Edge.", "On a computer: click the install icon ⊕ at the end of the address bar.", "On a phone: tap the menu ⋮, then \"Install app\" or \"Add to Home screen\"."];
  const ov = document.createElement('div'); ov.className = 'instov';
  ov.innerHTML = "<div class=\"instbox\"><b>📲 Install the app</b><ol>" + steps.map(s => '<li>' + s + '</li>').join('') + "</ol><p class=\"muted\">After installing, the app opens from its icon like any other app, and it works even without the internet.</p>" +
    "<p class=\"muted\">Link: <bdi class=\"en\">alialsaffarmosuluniversity.github.io/VisulaBasic</bdi></p><button class=\"btn\">OK</button></div>";
  ov.onclick = ev => { if (ev.target === ov || ev.target.tagName === 'BUTTON') ov.remove(); };
  document.body.appendChild(ov);
};
$('#themebtn').onclick = () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('vbtheme', t); } catch (e) {}
};
route();
})();

</script>
