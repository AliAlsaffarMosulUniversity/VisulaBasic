<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.en{direction:ltr;unicode-bidi:isolate;display:inline-block;font-family:'Consolas','Courier New',monospace;font-size:.86em;background:#eef2f8;border:1px solid #dbe3f0;border-radius:6px;padding:0 6px;line-height:1.55;color:#12305b;white-space:nowrap}

.btn:active{transform:translateY(1px)}.btn.ghost{background:#fff;color:var(--brand);border:2px solid var(--brand);box-shadow:none}.btn.small{padding:6px 14px;font-size:14px;margin-top:8px}.btn.danger{color:#b3261e;border-color:#b3261e;margin-top:24px}

.kicker{color:var(--accent);font-weight:700;font-size:14px}.hero h1{font-size:28px;margin:.1em 0 .3em}.hero p{opacity:.92;font-size:15px}

.herobtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.hero .btn{background:var(--accent);color:var(--brand)}.hero .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.7)}
.ring{--p:0;flex:none;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),rgba(255,255,255,.22) 0);display:grid;place-items:center;position:relative;z-index:1}
.ring:before{content:'';position:absolute;inset:9px;border-radius:50%;background:#173a66}.ring b,.ring small{position:relative;text-align:center;line-height:1.1}.ring b{font-size:22px;margin-top:20px}.ring small{font-size:11px;margin-top:-34px;opacity:.8}
.ring.big{width:120px;height:120px;margin:0 auto;background:conic-gradient(var(--teal) calc(var(--p)*1%),#dfe6ee 0)}.ring.big:before{background:#fff}.ring.big b{margin-top:0;color:var(--brand);font-size:26px}

.chcard{--c:#0e7c86;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;position:relative;display:block;box-shadow:0 1px 0 rgba(0,0,0,.04);border-top:5px solid var(--c)}
.chcard:active{transform:scale(.99)}.chico{font-size:30px;line-height:1}.chnum{color:var(--c);font-size:13px;font-weight:700;margin-top:6px}.chcard b{display:block;font-size:17px;line-height:1.4}.chcard small{display:block;color:var(--mut);font-size:13px;line-height:1.5;margin:2px 0 10px}

.foot{margin:34px 0 8px;text-align:center;line-height:1.9;color:var(--mut);font-size:14px;font-weight:700}.foot small{display:block;margin-top:8px;font-weight:400;font-size:12px;opacity:.8}

.chhead{--c:#0e7c86;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-right:6px solid var(--c);border-radius:var(--r);padding:12px 14px;position:relative}
.chhead .chico{font-size:34px}.chhead h1{font-size:22px;margin:0}.chhead .back{position:absolute;left:12px;top:10px;font-size:13px;color:var(--mut)}
.tabs2{display:flex;gap:6px;margin:14px 0;position:sticky;top:66px;z-index:10;background:var(--bg);padding:6px 0}.tabs2 button{flex:1;font:inherit;font-weight:700;border:2px solid var(--line);background:#fff;color:var(--mut);padding:8px;border-radius:12px;cursor:pointer}.tabs2 button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.chbody{padding:0 2px}
.callout{display:flex;gap:10px;border-radius:14px;padding:12px 14px;margin:14px 0;font-size:15.5px}.callout>span{font-size:20px;line-height:1.5}.callout.tip{background:#e9f6ef;border:1px solid #b9e2cb}.callout.warn{background:#fff4de;border:1px solid #f1d28b}.callout.note{background:#eaf1fb;border:1px solid #c5d8f2}
.tblwrap{overflow-x:auto;margin:12px 0;border-radius:12px;border:1px solid var(--line);background:#fff}
.tbl{border-collapse:collapse;width:100%;font-size:15px}.tbl th{background:#14325c;color:#fff;text-align:right;padding:8px 12px;font-weight:700;white-space:nowrap}.tbl td{padding:8px 12px;border-top:1px solid var(--line);vertical-align:top}.tbl tr:nth-child(even) td{background:#faf8f3}.tl{font-family:monospace;font-size:13px;text-align:left}
.codewrap{margin:12px 0}.codecap{font-size:13px;color:var(--mut)}
pre.code{margin:10px 0;background:#0f1d33;color:#e6edf7;border-radius:12px;padding:14px 16px;font-family:'Consolas','Courier New',monospace;font-size:13.5px;line-height:1.75;overflow-x:auto;text-align:left;direction:ltr;white-space:pre;tab-size:3}
pre.code i{font-style:normal}.code .k{color:#7cc4ff;font-weight:700}.code .s{color:#f9b872}.code .c{color:#8fb78f}.code .n{color:#d7a6ff}.code .t{color:#7fe3b0}
.excard{background:#fff;border:2px solid #d8e3f3;border-radius:18px;padding:14px;margin:18px 0;box-shadow:0 4px 0 #e6edf8}
.exhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.exhead b{font-size:17px}.exbadge{background:var(--accent);color:var(--brand);font-weight:800;border-radius:8px;padding:0 10px;font-size:13px}
.exdesc{color:var(--mut);font-size:15px;margin:.3em 0 10px}
.runner{background:repeating-linear-gradient(45deg,#e9e5da,#e9e5da 8px,#eeeadf 8px,#eeeadf 16px);border-radius:14px;padding:12px 4px;overflow:hidden;min-height:60px}
.exbtns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}.exbtns button{font:inherit;font-weight:700;font-size:14px;border:2px solid #cfd9ea;background:#f5f8fd;color:var(--brand);padding:6px 12px;border-radius:10px;cursor:pointer}.exbtns .btn{color:#fff;background:var(--brand);border:0;padding:10px 18px;font-size:16px}.exbtns .btn.ghost{background:#fff;color:var(--brand);border:2px solid var(--brand)}
.subh{font-weight:800;color:var(--brand);margin:14px 0 4px;font-size:15px}
.pager{display:flex;justify-content:space-between;margin:34px 0 10px}
/* VB window */
.vbhold{margin:0 auto;position:relative}
.vbwin{direction:ltr;text-align:left;display:inline-block;transform-origin:top left;background:#d4d0c8;border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:1px 1px 0 #808080,4px 5px 10px rgba(0,0,0,.35);font-family:Tahoma,'Segoe UI',Arial,sans-serif;font-size:11px;color:#000;position:relative;padding:2px}

.vbwb i{font-style:normal;display:inline-block;width:16px;height:14px;background:#d4d0c8;color:#000;border:1px solid;border-color:#fff #404040 #404040 #fff;font-size:9px;line-height:12px;text-align:center;margin-left:2px}

.vblabel{white-space:pre-wrap;line-height:1.3;padding:1px 2px}
.vblabel.bd1,.vbimg.bd1{border:1px solid;border-color:#808080 #fff #fff #808080}
.vbtext{border:2px solid;border-color:#808080 #fff #fff #808080;outline:0;padding:1px 3px;background:#fff;color:#000;border-radius:0;box-shadow:inset 1px 1px 0 #404040;user-select:text;-webkit-user-select:text;font-size:11px}
textarea.vbtext{resize:none}
.vbtext:focus{box-shadow:inset 1px 1px 0 #404040,0 0 0 1px #0a246a}.vbtext:disabled{color:#808080}
.vbbtn{background:#d4d0c8;border:2px solid;border-color:#fff #404040 #404040 #fff;padding:0 4px;cursor:default;color:#000;outline:0;box-shadow:1px 1px 0 #808080;border-radius:0}
.vbbtn:active{border-color:#404040 #fff #fff #404040;padding:2px 2px 0 6px}.vbbtn:focus-visible{outline:1px dotted #000;outline-offset:-5px}.vbbtn.isdef{border:2px solid #000;box-shadow:none}.vbbtn:disabled{color:#808080;text-shadow:1px 1px 0 #fff}
.vbimg{display:grid;place-items:center;line-height:1;cursor:grab}
.vbghost{position:fixed!important;z-index:9999;opacity:.65;pointer-events:none;display:grid;place-items:center;background:transparent!important}
.vbov{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.28);display:grid;place-items:center}
.vbdlg{background:#d4d0c8;border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:2px 3px 10px rgba(0,0,0,.5);min-width:180px;max-width:92%;font-size:12px;padding:2px}
.dtitle{background:linear-gradient(90deg,#0a246a,#a6caf0);color:#fff;font-weight:700;padding:2px 4px;display:flex;justify-content:space-between;align-items:center}.dtitle i{font-style:normal;background:#d4d0c8;color:#000;width:16px;text-align:center;cursor:pointer;border:1px solid;border-color:#fff #404040 #404040 #fff;font-size:10px}
.dbody{display:flex;gap:12px;padding:14px 14px 10px;align-items:flex-start}.dico{font-size:30px;line-height:1}.dmsg{flex:1;font-size:12px;line-height:1.5;word-break:break-word}.dar{margin-top:8px;font-family:'Cairo',sans-serif;font-size:12.5px;color:#7a1f1f;line-height:1.6}
.dinput{padding:0 14px 6px}.dinput input{width:100%;border:2px solid;border-color:#808080 #fff #fff #808080;padding:3px 5px;font:inherit;background:#fff;outline:0}
.dbtns{display:flex;gap:8px;justify-content:center;padding:6px 10px 12px;flex-wrap:wrap}.dbtns button{min-width:68px;padding:3px 10px;font:inherit;background:#d4d0c8;border:2px solid;border-color:#fff #404040 #404040 #fff;cursor:pointer;color:#000}.dbtns button.def{border:2px solid #000}.dbtns button:active{border-color:#404040 #fff #fff #404040}
.vbend{position:absolute;inset:0;z-index:60;background:rgba(30,30,40,.55);display:grid;place-items:center;color:#fff}.vbend div{text-align:center;display:grid;gap:6px;font-family:'Cairo',sans-serif}.vbend b{font-size:22px;font-family:monospace}.vbend button{font:inherit;font-weight:700;background:var(--accent);border:0;border-radius:8px;padding:6px 14px;cursor:pointer;color:#14325c}
.cerr{background:#2a0f0f;color:#ffb4b4;border-radius:12px;padding:14px;font-family:monospace;font-size:13.5px;line-height:1.6;margin:6px}
/* widgets */
.widget{background:#fff;border:2px dashed #c9d6ea;border-radius:16px;padding:12px;margin:14px 0}
.winfo{background:#f3f7fd;border-radius:12px;padding:10px 12px;margin-top:10px;font-size:15px;min-height:44px}.winfo p{margin:.2em 0}
.ide{display:grid;gap:6px;font-family:Tahoma,Arial,sans-serif;font-size:12px}.ide .r{font:inherit;background:#d4d0c8;border:2px solid;border-color:#fff #404040 #404040 #fff;padding:8px 4px;cursor:pointer;color:#000;font-weight:700}.ide .r.on{background:#ffe9a8;outline:2px solid var(--accent)}
.ide-main{display:grid;grid-template-columns:70px 1fr 120px;gap:6px;min-height:150px}.ide-right{display:grid;grid-template-rows:1fr 1.3fr .8fr;gap:6px}.ide .r-form{background:repeating-conic-gradient(#fff 0 25%,#f1f1f1 0 50%) 0 0/10px 10px}.ide .r-form span{background:#0a246a;color:#fff;display:block;padding:2px 6px;text-align:left}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}.tools button{font-family:Tahoma,Arial,sans-serif;background:#d4d0c8;border:2px solid;border-color:#fff #404040 #404040 #fff;padding:6px 2px;cursor:pointer;color:#000}.tools span{display:block;font-size:20px;line-height:1.2}.tools small{font-size:10.5px}.tools button.on{background:#ffe9a8}
.wl{display:block;font-weight:700;margin:12px 0 4px;color:var(--brand);font-size:15px}.winput,.sel{width:100%;font:inherit;padding:9px 12px;border:2px solid #cfd9ea;border-radius:12px;background:#fff;color:var(--ink)}.winput[dir=ltr]{font-family:monospace}
.rule{display:flex;gap:8px;padding:3px 0;font-size:15px}.rule span{font-weight:800;width:20px}.rule.ok span{color:#1b8a4b}.rule.no span{color:#c62828}.verdict{margin-top:8px;border-radius:10px;padding:8px 12px;font-weight:800;text-align:center}.verdict.ok{background:#e3f6ea;color:#17703e}.verdict.no{background:#fde7e7;color:#a4262c}
.mrow{display:flex;gap:10px;flex-wrap:wrap}.mrow label{flex:1;min-width:100px;font-weight:700;font-size:14px;color:var(--brand)}.mrow input,.mrow select{display:block;width:100%;margin-top:3px;font:inherit;font-family:monospace;padding:7px 9px;border:2px solid #cfd9ea;border-radius:10px;background:#fff}
.mcode{margin:10px 0}.mcode{background:#0f1d33;color:#e6edf7;border-radius:10px;padding:10px 14px;font-family:monospace;font-size:13.5px;white-space:pre;direction:ltr;text-align:left}.mcode i{font-style:normal}.mcode .k{color:#7cc4ff;font-weight:700}.mcode .s{color:#f9b872}.mcode .c{color:#8fb78f}.mcode .n{color:#d7a6ff}.mcode .t{color:#7fe3b0}
.memcell{display:inline-block;border:3px solid var(--teal);border-radius:12px;padding:6px 18px;text-align:center;background:#e9f7f8}.memcell small{display:block;color:var(--mut)}.memcell b{font-size:24px;font-family:monospace;color:var(--brand)}.memerr{background:#fde7e7;color:#a4262c;border-radius:10px;padding:10px 12px;font-weight:700}
.mbstage{margin-top:8px}.mbres{margin-top:6px;font-weight:700}
.mouse{display:grid;gap:8px}.marea{height:130px;border-radius:12px;background:repeating-linear-gradient(0deg,#eef3fb,#eef3fb 14px,#e2eaf7 14px,#e2eaf7 15px);border:2px solid #b7c8e4;display:grid;place-items:center;color:var(--mut);font-family:monospace;user-select:none;-webkit-user-select:none}.mout{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.mout div{background:#0f1d33;color:#9fe0b1;border-radius:10px;padding:6px 8px;text-align:center;font-family:monospace}.mout span{display:block;font-size:11px;color:#9ab}.mout b{font-size:15px}
/* quiz */
.qintro{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:12px;display:flex;flex-direction:column}.qintro span{color:var(--mut);font-size:14px}.qintro.big{align-items:center;text-align:center;gap:10px;padding:22px}.qintro.big b{font-size:22px}.scale{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.scale span{background:#eef2f8;border-radius:8px;padding:2px 10px;font-size:13px}
.qprog{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--mut);margin-bottom:8px}.qprog .bar{flex:1}
.qcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}.qtext{font-size:18px;font-weight:700;line-height:1.7}
.opts{display:grid;gap:8px;margin-top:12px}.opt{font:inherit;text-align:right;background:#f6f8fc;border:2px solid #d3ddee;border-radius:12px;padding:10px 14px;cursor:pointer;color:var(--ink);line-height:1.6}.opt:active{transform:scale(.99)}.opt:disabled{cursor:default;color:var(--ink)}.opt.right{background:#e3f6ea;border-color:#2e9e5b}.opt.wrong{background:#fde7e7;border-color:#d34a4a}
.qfb{margin-top:12px;border-radius:12px;padding:10px 14px;font-size:15px}.qfb.good{background:#e9f8ee}.qfb.bad{background:#fff0e0}.qcard .btn{margin-top:12px}
.result{text-align:center}.rev{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:10px 0;text-align:right}.rev .ans{color:#17703e;font-weight:700;margin-top:4px}.rev small{color:var(--mut)}
.task{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}.tnum{flex:none;width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--brand);display:grid;place-items:center;font-weight:800}.tbody{flex:1;min-width:0}details summary{cursor:pointer;font-weight:700;color:var(--teal);margin-top:6px}

.pagehead p{color:var(--mut)}.editor{width:100%;min-height:300px;margin-top:10px;background:#0f1d33;color:#e6edf7;border:0;border-radius:14px;padding:14px;font-family:'Consolas','Courier New',monospace;font-size:13.5px;line-height:1.7;resize:vertical;direction:ltr;text-align:left;tab-size:3;outline:0}
.editor:focus{box-shadow:0 0 0 3px rgba(242,169,0,.5)}.snips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.snips button{font:inherit;font-family:monospace;font-size:13px;background:#fff;border:1px solid #cfd9ea;border-radius:8px;padding:2px 10px;cursor:pointer;color:var(--brand)}
.cheat{margin-top:14px}.runner.lab{margin-top:10px}
.gl{display:grid;gap:8px;margin-top:12px}.gi{display:flex;gap:12px;align-items:baseline;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}.gi .en{flex:none;min-width:110px;text-align:center}.gi span{font-size:15px}
.cards2{display:grid;gap:10px}.prow{--c:#0e7c86;display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:8px 0;border-right:5px solid var(--c)}.pico{font-size:26px}.pmid{flex:1}.pmid small{color:var(--mut)}.ppct{font-weight:800;color:var(--brand);font-size:18px}

@media (min-width:700px){#view{padding:22px}.hero h1{font-size:34px}}
@media (max-width:380px){.ide-main{grid-template-columns:56px 1fr 96px}.hero{flex-direction:column-reverse;align-items:flex-start}.mout{grid-template-columns:repeat(3,1fr)}}

</style>

ex('e6i', 6, 'واجب: دالة بثلاثة فروع (Select Case)', 'y = (x³+5)/(x²−2) عند x=1..4 ، و y = 7x⁻² عند 5≤x≤10 ، و y = 60−x عند x>11. ماذا عن x=11؟',
  F('Form1', 300, 190, [L('Label1', 'x', 20, 20, 120), L('Label2', 'y', 20, 60, 120), T('Text1', '2', 160, 17, 110), T('Text2', '', 160, 57, 110, 22, { locked: true }), C('Command1', 'Solve', 90, 110, 120, 30)]),
  String.raw`
Private Sub Command1_Click()
Dim x As Single, y As Single
x = Val(Text1.Text)
Select Case x
Case 1, 2, 3, 4
y = (x ^ 3 + 5) / (x ^ 2 - 2)
Text2.Text = y
Case 5 To 10
y = 7 * x ^ -2
Text2.Text = y
Case Is > 11
y = 60 - x
Text2.Text = y
Case Else
Text2.Text = "Undefined"
End Select
End Sub`);

/* ---------- quiz engine ---------- */
function runQuiz(box, list, opt) {
  opt = opt || {};
  const qs = shuffle(list).slice(0, opt.n || list.length).map(q => { const all = shuffle([q.ok].concat(q.bad)); return Object.assign({}, q, { all, idx: all.indexOf(q.ok) }); });
  let i = 0, score = 0; const wrong = [];
  function show() {
    const q = qs[i];
    box.innerHTML = '<div class="qprog"><span>سؤال ' + (i + 1) + ' من ' + qs.length + '</span><div class="bar"><i style="width:' + (i / qs.length * 100) + '%"></i></div></div>' +
      '<div class="qcard"><div class="qtext">' + rt(q.q) + '</div>' + (q.c ? '<pre class="code" dir="ltr">' + hl(q.c) + '</pre>' : '') +
      '<div class="opts">' + q.all.map((o, k) => '<button class="opt" data-k="' + k + '">' + rt(o) + '</button>').join('') + '</div><div class="qfb" hidden></div></div>';
    $$('.opt', box).forEach(b => b.onclick = () => {
      const k = +b.dataset.k; $$('.opt', box).forEach(x => x.disabled = true);
      const okb = $$('.opt', box)[q.idx]; okb.classList.add('right');
      const fb = $('.qfb', box); fb.hidden = false;
      if (k === q.idx) { score++; fb.className = 'qfb good'; fb.innerHTML = '<b>أحسنت ✔</b> ' + rt(q.e); } else { b.classList.add('wrong'); wrong.push(q); fb.className = 'qfb bad'; fb.innerHTML = '<b>الإجابة الصحيحة: </b>' + rt(q.ok) + '<br>' + rt(q.e); }
      const nx = document.createElement('button'); nx.className = 'btn'; nx.textContent = i + 1 < qs.length ? 'التالي ←' : 'عرض النتيجة'; nx.onclick = () => { i++; i < qs.length ? show() : finish(); }; fb.after(nx);
    });
  }
  function finish() {
    const pct = Math.round(score / qs.length * 100);
    const g = pct >= 90 ? 'ممتاز' : pct >= 80 ? 'جيد جدًا' : pct >= 70 ? 'جيد' : pct >= 60 ? 'متوسط' : pct >= 50 ? 'مقبول' : 'راسب';
    box.innerHTML = '<div class="result"><div class="ring big" style="--p:' + pct + '"><b>' + pct + '%</b></div><h3>' + score + ' من ' + qs.length + ' — ' + g + '</h3>' +
      (wrong.length ? '<div class="subh">راجع هذه الأسئلة:</div>' + wrong.map(q => '<div class="rev"><div>' + rt(q.q) + '</div>' + (q.c ? '<pre class="code" dir="ltr">' + hl(q.c) + '</pre>' : '') + '<div class="ans">✔ ' + rt(q.ok) + '</div><small>' + rt(q.e) + '</small></div>').join('') : '<p>إجابات كلها صحيحة! 🎉</p>') +
      '<button class="btn" id="qre">↻ أعد المحاولة</button></div>';
    $('#qre', box).onclick = () => runQuiz(box, list, opt);
    opt.onDone && opt.onDone(pct);
  }
  show();
}

    $$('.tabs2 button').forEach(b => b.classList.toggle('on', b.dataset.t === chTab));
    if (chTab === 'learn') {
      body.innerHTML = renderBlocks(c.blocks) + '<div class="pager">' + (id > 1 ? '<a class="btn ghost" href="#ch' + (id - 1) + '">› السابق</a>' : '<span></span>') + '<button class="btn" data-go="quiz">اختبر نفسك ←</button></div>';
      bindEx(body); bindWidgets(body);
    } else if (chTab === 'quiz') {
      body.innerHTML = '<div class="qintro"><b>اختبار الفصل ' + c.id + '</b><span>' + c.quiz.length + ' سؤالًا. أفضل نتيجة لك: ' + (prog.quiz[c.id] || 0) + '%</span></div><div id="qbox"></div>';
      runQuiz($('#qbox'), c.quiz, { onDone(p) { if (p > (prog.quiz[c.id] || 0)) { prog.quiz[c.id] = p; saveProg(); } } });
    } else {
      body.innerHTML = '<p class="muted">حاول الحل بنفسك أولًا ثم اضغط «الحل».</p>' + c.tasks.map((t, i) => '<div class="task"><div class="tnum">' + (i + 1) + '</div><div class="tbody"><div>' + rt(t.t) + '</div>' + (t.a ? '<details><summary>عرض الحل</summary>' + (/^(Private Sub|MsgBox)/.test(t.a) ? '<pre class="code" dir="ltr">' + hl(t.a) + '</pre>' : '<p>' + esc(t.a).replace(/\n/g, '<br>') + '</p>') + '</details>' : '') + (t.ex ? '<button class="btn small" data-lab="' + t.ex + '">🧪 جرّب الحل في المختبر</button>' : '') + '</div></div>').join('');
    }
  };
  draw();
  view.addEventListener('click', function h(e) {
    if (!view.contains(body)) { view.removeEventListener('click', h); return; }
    const t = e.target.closest('.tabs2 button'); if (t) { chTab = t.dataset.t; draw(); window.scrollTo(0, 0); return; }
    const g = e.target.closest('[data-go]'); if (g) { chTab = g.dataset.go; draw(); window.scrollTo(0, 0); }
    const l = e.target.closest('[data-lab]'); if (l) openLab(l.dataset.lab);
  });
}

const SNIP = [['Click', 'Private Sub Command1_Click()\n\nEnd Sub\n'], ['If', 'If x > 0 Then\n   \nElse\n   \nEnd If\n'], ['Select', 'Select Case x\nCase 1\n   \nCase Else\n   \nEnd Select\n'], ['InputBox', 'x = Val(InputBox("Enter x", "Title"))\n'], ['MsgBox', 'MsgBox "Hello", 64, "Title"\n'], ['Dim', 'Dim x As Integer\n']];
function openLab(id, code) { labState = { id: id, code: code == null ? null : code }; if (location.hash === '#lab') viewLab(); else location.hash = '#lab'; }
function viewLab() {
  const e = EX[labState.id] || EX.lab0;
  const groups = [[0, 'مختبر فارغ']].concat(CH.map(c => [c.id, 'الفصل ' + c.id + ': ' + c.title]));
  view.innerHTML = '<div class="pagehead"><h1>🧪 مختبر Visual Basic</h1><p>اختر مثالًا أو اكتب شيفرتك. ثم اضغط «تشغيل». الأدوات في النموذج تتفاعل كما في برنامج حقيقي.</p></div>' +
    '<label class="wl">اختر مثالًا:</label><select id="labsel" class="sel">' + groups.map(g => '<optgroup label="' + esc(g[1]) + '">' + Object.values(EX).filter(x => x.ch === g[0]).map(x => '<option value="' + x.id + '"' + (x.id === e.id ? ' selected' : '') + '>' + esc(x.title) + '</option>').join('') + '</optgroup>').join('') + '</select>' +
    '<div class="runner lab" id="labrun"></div><div class="exbtns"><button class="btn" id="labgo">▶ تشغيل الشيفرة</button><button class="btn ghost" id="labreset">↺ استرجع الشيفرة الأصلية</button></div>' +
    '<div class="snips">' + SNIP.map((s, i) => '<button data-s="' + i + '">+ ' + s[0] + '</button>').join('') + '</div>' +
    '<textarea id="labcode" class="editor" dir="ltr" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>' +
    '<details class="cheat"><summary>📋 ورقة مرجعية سريعة</summary><div class="cheatbody" dir="ltr"><pre class="code">' + hl(CHEAT) + '</pre></div></details>' + footer();
  const ta = $('#labcode'); ta.value = labState.code != null ? labState.code : e.code;
  const run = () => { labState.code = ta.value; const c = mountRunner($('#labrun'), e, { code: ta.value }); };
  run();
  $('#labsel').onchange = ev => { labState = { id: ev.target.value, code: null }; viewLab(); };
  $('#labgo').onclick = run;
  $('#labreset').onclick = () => { ta.value = e.code; run(); };
  ta.addEventListener('keydown', ev => {
    if (ev.key === 'Tab') { ev.preventDefault(); const s = ta.selectionStart; ta.value = ta.value.slice(0, s) + '   ' + ta.value.slice(ta.selectionEnd); ta.selectionStart = ta.selectionEnd = s + 3; }
    if ((ev.ctrlKey || ev.metaKey) && ev.key === 'Enter') { ev.preventDefault(); run(); }
  });
  $('.snips').onclick = ev => { const b = ev.target.closest('[data-s]'); if (!b) return; const s = ta.selectionStart, t = SNIP[b.dataset.s][1]; ta.value = ta.value.slice(0, s) + t + ta.value.slice(ta.selectionEnd); ta.focus(); ta.selectionStart = ta.selectionEnd = s + t.length; };
}
const CHEAT = String.raw`' Events
Private Sub Command1_Click()
Private Sub Text1_Change()
Private Sub Form_Load()

' Properties
Label1.Caption = "Hi"        ' text shown
Text1.Text = ""              ' value in box
Label1.ForeColor = vbBlue
Text1.Visible = False

' Variables
Dim x As Integer, s As String
Const PI As Single = 3.14

' Input / Output
x = Val(InputBox("Enter x", "Title"))
MsgBox "Done", 64, "Title"
Print "x = "; x

' Decisions
If x > 0 Then ... ElseIf ... Else ... End If
Select Case x: Case 1 To 5: Case Is > 9: Case Else
GoTo MyLabel`;

/* exam */
let examState = null;
function viewExam() {
  const all = []; CH.forEach(c => c.quiz.forEach(q => all.push(q)));
  view.innerHTML = '<div class="pagehead"><h1>📝 الاختبار الشامل</h1><p>20 سؤالًا عشوائيًا من الفصول الستة. التقدير بحسب سلّم المحاضرة.</p></div><div id="exbox"></div>' + footer();
  const box = $('#exbox');
  const intro = () => {
    box.innerHTML = '<div class="qintro big"><b>جاهز؟</b><span>أفضل نتيجة سابقة: ' + (prog.exam || 0) + '%</span><div class="scale"><span>90+ ممتاز</span><span>80 جيد جدًا</span><span>70 جيد</span><span>60 متوسط</span><span>50 مقبول</span><span>أقل: راسب</span></div><button class="btn" id="exgo">ابدأ الاختبار</button></div>';
    $('#exgo').onclick = () => runQuiz(box, all, { n: 20, onDone(p) { if (p > (prog.exam || 0)) { prog.exam = p; saveProg(); } } });
  };
  intro();
}
function viewGloss() {
  view.innerHTML = '<div class="pagehead"><h1>📖 مسرد المصطلحات</h1></div><input id="gs" class="winput" placeholder="ابحث عن مصطلح…" dir="auto"><div id="gl" class="gl"></div>' + footer();
  const draw = q => { q = q.trim().toLowerCase(); $('#gl').innerHTML = GLOSS.filter(g => !q || g[0].toLowerCase().includes(q) || g[1].includes(q)).map(g => '<div class="gi"><bdi class="en">' + esc(g[0]) + '</bdi><span>' + esc(g[1]) + '</span></div>').join('') || '<p class="muted">لا نتائج.</p>'; };
  $('#gs').oninput = e => draw(e.target.value); draw('');
}
function viewMe() {
  view.innerHTML = '<div class="pagehead"><h1>📊 تقدّمي</h1></div><div class="cards2">' + CH.map(c => { const p = chapterProg(c); return '<div class="prow" style="--c:' + c.color + '"><div class="pico">' + c.icon + '</div><div class="pmid"><b>الفصل ' + c.id + ': ' + esc(c.title) + '</b><div class="bar"><i style="width:' + p.pct + '%"></i></div><small>' + p.ran + '/' + p.total + ' أمثلة · اختبار ' + p.q + '%</small></div><div class="ppct">' + p.pct + '%</div></div>'; }).join('') + '</div>' +
    '<div class="prow"><div class="pico">📝</div><div class="pmid"><b>الاختبار الشامل</b><small>أفضل نتيجة</small></div><div class="ppct">' + (prog.exam || 0) + '%</div></div>' +
    '<h2 class="sec">ملاحظاتي</h2><p class="muted">اكتب ما تريد سؤال الأستاذ عنه في المحاضرة. تُحفظ على هذا الجهاز فقط.</p>' +
    CH.map(c => '<label class="wl">الفصل ' + c.id + ': ' + esc(c.title) + '</label><textarea class="note" data-n="' + c.id + '" placeholder="ملاحظاتك…" dir="auto">' + esc(prog.notes[c.id] || '') + '</textarea>').join('') +
    '<button class="btn ghost danger" id="rst">مسح تقدّمي</button>' + footer();
  $$('.note').forEach(t => t.oninput = () => { prog.notes[t.dataset.n] = t.value; saveProg(); });
  let armed = false; $('#rst').onclick = e => { if (!armed) { armed = true; e.target.textContent = 'اضغط مرة أخرى للتأكيد'; return; } prog = { quiz: {}, ran: {}, notes: {}, last: null, exam: 0 }; saveProg(); viewMe(); };
}

/* ---------- router ---------- */
const NAV = [['home', '🏠', 'الرئيسية'], ['lab', '🧪', 'المختبر'], ['exam', '📝', 'الاختبار'], ['gloss', '📖', 'المسرد'], ['me', '📊', 'تقدّمي']];
function route() {
  const h = (location.hash || '#home').slice(1);
  if (view.querySelector('.runner') ) $$('.runner', view).forEach(r => r._ctl && r._ctl.destroy());
  let tab = h;
  if (/^ch\d$/.test(h)) { tab = 'home'; viewChapter(+h.slice(2)); } else if (h === 'lab') viewLab(); else if (h === 'exam') viewExam(); else if (h === 'gloss') viewGloss(); else if (h === 'me') viewMe(); else { tab = 'home'; viewHome(); }
  $$('#nav a').forEach(a => a.classList.toggle('on', a.dataset.k === tab));
  if (!/^ch\d$/.test(h) || true) window.scrollTo(0, 0);
}
$('#nav').innerHTML = NAV.map(n => '<a href="#' + n[0] + '" data-k="' + n[0] + '"><span>' + n[1] + '</span>' + n[2] + '</a>').join('');
window.addEventListener('hashchange', route);
route();
})();

</script>
